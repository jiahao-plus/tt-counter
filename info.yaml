# Tiny Tapeout project information
project:
  title:        "8-bit up/down counter"
  author:       "jiahao_plus"
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "8-bit up/down counter controlled by two inputs (en/dir), useful as a first silicon test and for reverse-engineering reference structures"
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     100000  # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_jiahao_plus_counter"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "pwm.v"
    - "LFSR_Design.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "mode0 en (1=count, 0=hold); mode2 LFSR enable"
  ui[1]: "mode0 dir (1=up, 0=down); mode2 LFSR output_enable"
  ui[2]: "mode select bit 0 (ui_in[7:2])"
  ui[3]: "mode select bit 1 (ui_in[7:2])"
  ui[4]: "mode select bit 2 (ui_in[7:2])"
  ui[5]: "mode select bit 3 (ui_in[7:2])"
  ui[6]: "mode select bit 4 (ui_in[7:2])"
  ui[7]: "mode select bit 5 (ui_in[7:2])"

  # Outputs
  uo[0]: "mode0 count bit 0 (LSB); mode2 LFSR state bit 0"
  uo[1]: "mode0 count bit 1; mode2 LFSR state bit 1"
  uo[2]: "mode0 count bit 2; mode2 LFSR state bit 2"
  uo[3]: "mode0 count bit 3; mode2 LFSR state bit 3"
  uo[4]: "mode0 count bit 4; mode2 LFSR state bit 4"
  uo[5]: "mode0 count bit 5; mode2 LFSR state bit 5"
  uo[6]: "mode0 count bit 6; mode2 LFSR state bit 6"
  uo[7]: "mode0 count bit 7 (MSB); mode2 LFSR state bit 7"

  # Bidirectional pins
  uio[0]: "mode1 pwm_out; mode2 LFSR serial Out"
  uio[1]: "mode2 LFSR valid"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
