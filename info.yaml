# Tiny Tapeout project information
project:
  title:        "TopoSEM research structures (2x2)"
  author:       "jiahao_plus"
  discord:      ""
  description:  "2x2 research vehicle for cross-layer SEM connectivity: M1-Via1-M2 and M2-Via2-M3 signal links, topology positives/negatives, geometry ladders and multi-layer fiducials, plus the V1 counter/PWM/LFSR test logic"
  language:     "Verilog"
  clock_hz:     100000

  # 2x2 per the confirmed design decision. Nominal 335 x 226 um.
  tiles: "2x2"

  top_module:  "tt_um_jiahao_plus_counter"

  source_files:
    - "project.v"
    - "pwm.v"
    - "LFSR_Design.v"
    - "research_macros.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# V2 keeps the V1 functional pinout unchanged so the V1 testbench still applies.
pinout:
  # Inputs
  ui[0]: "mode0 en (1=count, 0=hold); mode2 LFSR enable"
  ui[1]: "mode0 dir (1=up, 0=down); mode2 LFSR output_enable"
  ui[2]: "mode select bit 0 (ui_in[7:2])"
  ui[3]: "mode select bit 1 (ui_in[7:2])"
  ui[4]: "mode select bit 2 (ui_in[7:2])"
  ui[5]: "mode select bit 3 (ui_in[7:2])"
  ui[6]: "mode select bit 4 (ui_in[7:2])"
  ui[7]: "mode select bit 5 (ui_in[7:2])"

  # Outputs
  uo[0]: "mode0 count bit 0 (LSB); mode2 LFSR state bit 0"
  uo[1]: "mode0 count bit 1; mode2 LFSR state bit 1"
  uo[2]: "mode0 count bit 2; mode2 LFSR state bit 2"
  uo[3]: "mode0 count bit 3; mode2 LFSR state bit 3"
  uo[4]: "mode0 count bit 4; mode2 LFSR state bit 4"
  uo[5]: "mode0 count bit 5; mode2 LFSR state bit 5"
  uo[6]: "mode0 count bit 6; mode2 LFSR state bit 6"
  uo[7]: "mode0 count bit 7 (MSB); mode2 LFSR state bit 7"

  # Bidirectional pins
  uio[0]: "mode1 pwm_out; mode2 LFSR serial Out"
  uio[1]: "mode2 LFSR valid"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
